name: Setup Bun workspace
description: Set up Node and Bun, restore the Bun package cache, and install dependencies
inputs:
  browsers:
    description: Playwright browsers to install with their system dependencies
    required: false
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
    - uses: oven-sh/setup-bun@v2
    - uses: actions/cache@v6
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-bun-
    - run: bun install --frozen-lockfile
      shell: bash
    - if: ${{ inputs.browsers != '' }}
      env:
        PLAYWRIGHT_BROWSERS: ${{ inputs.browsers }}
      run: bunx playwright install --with-deps $PLAYWRIGHT_BROWSERS
      shell: bash
